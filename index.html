body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#21473c,#183830 60%,#2c6553);color:#fff;padding:20px;box-sizing:border-box}

.spin{width:22px;height:22px;border:3px solid #d7e4de;border-top-color:#21473c;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
