<meta property="og:description" content="Staff sign-in for SUFAAT Drycleaners. Customers: visit sufaat.co.ke">
<meta property="og:url" content="https://system.sufaat.co.ke/">
<meta property="og:image" content="https://system.sufaat.co.ke/og-image.png">

<style>
:root{
  --bg:#f2f5f3; --card:#fff; --ink:#14232f; --muted:#5f7180; --line:#e1e8ee;
  --g1:#21473c; --g2:#3f8a6e; --ink-brand:#0c1613;
  --grad:linear-gradient(135deg,var(--g1),var(--g2));
  --brand:var(--g1); --brand-2:color-mix(in srgb,var(--g1) 78%,#000); --brand-soft:color-mix(in srgb,var(--g1) 12%,#fff);
  --side1:var(--g1); --side2:color-mix(in srgb,var(--g1) 70%,#06100d);
  --head:'Barlow Condensed',Inter,sans-serif;
  --carpet:#8a5a2b; --carpet-soft:#f6ece1;
  --ok:#1d7f4e; --ok-soft:#e2f4ea; --warn:#a76400; --warn-soft:#fdf0d9;
  --bad:#b4322d; --bad-soft:#fbe5e3; --info:#2d5fb4; --info-soft:#e4ecfb;
  --r:12px; --shadow:0 1px 2px rgba(20,35,47,.06),0 2px 8px rgba(20,35,47,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,var(--side1),var(--side2));color:#d6e6df;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.logo{display:none}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--grad);box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
.logo b{display:block;font-size:14px;line-height:1.2}
.logo small{color:#8fb3bb;font-size:11.5px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#cfe3e7;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--g2)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .count{margin-left:auto;background:var(--grad);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px}
.side .foot{margin-top:auto;font-size:11.5px;color:#7fa2aa;padding:10px 8px}
/* main */
main{min-width:0;padding:22px 26px 90px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-family:var(--head);font-size:28px;margin:0;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.card-h h2,.md-h h2{font-family:var(--head);font-size:19px!important;font-weight:700!important;letter-spacing:.03em;text-transform:uppercase}
.kpi .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--head);font-size:28px!important;font-weight:800!important;letter-spacing:.01em!important}
.brand-logo{display:block;width:88%;margin:6px auto 12px}
.brand-tag{text-align:center;font-size:10.5px;letter-spacing:.32em;color:#a9cbbd;text-transform:uppercase;margin-bottom:14px}
.bubbles{position:absolute;right:-30px;bottom:60px;opacity:.07;pointer-events:none}
.side{position:relative}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{position:relative;border:0;border-radius:12px;color:#fff;font-weight:700;padding:14px 8px 10px;min-height:78px;cursor:pointer;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;line-height:1.15}
.tile:active{transform:scale(.96)}
.tile:hover{box-shadow:0 6px 14px rgba(0,0,0,.2)}
.tile small{font-weight:600;opacity:.9;font-size:12px}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;margin-top:6px}
.tile .big{font-family:var(--head);font-size:24px;font-weight:800;letter-spacing:.02em;line-height:1}
.tile .tag{position:absolute;top:5px;right:6px;background:rgba(255,255,255,.85);color:#1b3a52;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.tile.add-pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.mode{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.mode button{border:0;background:#fff;padding:8px 14px;font-weight:800;font-size:12.5px;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.mode button.on{background:var(--g1);color:#fff}
.mode button.on.exp{background:#d84315}
.xchip{display:inline-block;background:#fde3d8;color:#b23c11;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.crow{display:grid;grid-template-columns:40px 1fr 64px 90px 96px 84px 26px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .nm{font-weight:650}
.crow .lt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.crow .xp{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.crow .sz{display:flex;gap:4px;align-items:center}
.crow .sz input{width:56px}
.bell{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.bell .b{position:absolute;top:-5px;right:-5px;background:#d84315;color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 5px;min-width:18px;text-align:center}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:grid;gap:10px}
.tl .ev{position:relative;font-size:13px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--g1);box-shadow:0 0 0 3px #fff}
.tl .ev .w{color:var(--muted);font-size:12px}
.wa-sent{color:#1d7f4e;font-weight:600;font-size:12px}
.notify{background:linear-gradient(135deg,#f0faf5,#fff);border:1px solid #cfe8dc;border-radius:12px;padding:14px}
.notify .msg{background:#dcf8c6;border-radius:10px 10px 10px 2px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.stamp-prev{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stamp-prev img{width:170px;height:170px}
.pdfbtn{background:#fff4ef;border-color:#f3cdbd;color:#b23c11}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.mobile-bar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:#c5d2db}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(.92)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc9c6}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;margin:0;font-weight:650}
.card-h .sp{flex:1}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);cursor:default;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);opacity:.85}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.sw{border:2px solid transparent;border-radius:12px;padding:4px;background:#fff;cursor:pointer;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.sw i{display:block;height:46px;border-radius:9px;margin-bottom:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw.on{border-color:var(--ink);color:var(--ink)}
.custom-g{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.custom-g input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.gprev{flex:1;min-width:120px;height:36px;border-radius:8px;background:var(--grad)}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:#bcd0d8}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafcfd;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink:hover td{background:#f7fafb}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.s-Received{background:var(--info-soft);color:var(--info)}
.s-Cleaning,.s-Ironing,.s-Drying{background:var(--warn-soft);color:var(--warn)}
.s-Ready{background:var(--brand-soft);color:var(--brand-2)}
.s-Collected,.s-Delivered{background:var(--ok-soft);color:var(--ok)}
.p-Paid{background:var(--ok-soft);color:var(--ok)}
.p-Partial{background:var(--warn-soft);color:var(--warn)}
.p-Unpaid{background:var(--bad-soft);color:var(--bad)}
.svc{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.svc.cloth{background:var(--brand-soft);color:var(--brand-2)}
.svc.carpet{background:var(--carpet-soft);color:var(--carpet)}
.svc.mixed{background:linear-gradient(90deg,var(--brand-soft),var(--carpet-soft));color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.inp:focus{outline:2px solid color-mix(in srgb,var(--g1) 35%,#fff);border-color:var(--brand)}
.toolbar .inp{width:auto}
.search{min-width:220px}
.tabs{display:inline-flex;background:#e9eff3;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#eaf0f3;border-radius:var(--r);padding:10px;min-height:120px}
.col h3{font-size:12.5px;margin:2px 4px 10px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.col h3 .n{margin-left:auto;background:#fff;color:var(--ink);border-radius:10px;padding:0 7px;font-size:11.5px}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.tk:hover{border-color:#b8cdd5}
.tk .t1{display:flex;justify-content:space-between;font-weight:650;font-size:13px}
.tk .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
.tk .t3{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.late{color:var(--bad);font-weight:600}
/* form */
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#33495a}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.seg input{display:none}
.seg label.on{background:var(--grad);color:#fff}
.seg label.on.carpet{background:var(--carpet)}
.seg label.on.mixed{background:linear-gradient(90deg,var(--g1),var(--carpet))}
#items-c:not(:empty){margin-top:18px;padding-top:4px;border-top:2px dashed var(--line)}
@media (max-width:520px){ #svc-seg{display:flex;width:100%} #svc-seg label{flex:1;justify-content:center;padding:8px 6px;font-size:12.5px} }
.items{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.irow{display:grid;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:end}
.irow:last-child{border-bottom:0}
.irow.cloth{grid-template-columns:1.3fr 1.4fr .6fr .8fr .8fr auto}
.irow.carpet{grid-template-columns:.7fr 1.2fr .7fr .7fr .6fr .8fr .9fr auto}
.irow .lt{font-weight:650;text-align:right;padding-bottom:9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.irow .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:8px 4px;font-size:18px;line-height:1}
.ihead{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sumbox{background:#f6f9fa;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.sumbox .r{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sumbox .r.big{font-size:17px;font-weight:700;border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:18px 0 8px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,25,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;z-index:50}
.md{background:#fff;border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto 0}
.md.narrow{width:min(480px,100%)}
.md-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:2}
.md-h h2{margin:0;font-size:17px}
.md-h .sp{flex:1}
.md-b{padding:16px 18px}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:#fff;border-radius:0 0 14px 14px}
.closeb{border:0;background:#eef3f5;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1}
.steps{display:flex;gap:4px;margin:4px 0 14px;flex-wrap:wrap}
.step{flex:1;min-width:84px;text-align:center;font-size:12px;font-weight:600;padding:8px 4px;border-radius:8px;background:#eef3f5;color:var(--muted);position:relative}
.step.done{background:var(--brand-soft);color:var(--brand-2)}
.step.cur{background:var(--grad);color:#fff}
.carpet-o .step.done{background:var(--carpet-soft);color:var(--carpet)}
.carpet-o .step.cur{background:var(--carpet);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.receipt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:#fbfbf8;border:1px dashed #cfd6c8;border-radius:8px;padding:14px;white-space:pre-wrap;line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14232f;color:#fff;padding:10px 16px;border-radius:10px;font-weight:500;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.banner{background:var(--warn-soft);color:#6b4300;border:1px solid #f2d9a8;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.banner.info{background:var(--info-soft);color:#1f437f;border-color:#c9d8f3}
.bar-chart svg{width:100%;height:auto;display:block}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:30px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--g1);border-radius:16px;padding:22px 28px;margin-bottom:16px;color:var(--ink);box-shadow:var(--shadow)}
.hero-logo{width:230px;flex:none;position:relative;z-index:1}
.hero-txt{flex:1;min-width:0;position:relative;z-index:1}
.hero-k{font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--g2)}
.hero h1{color:var(--g1);font-family:var(--head);font-size:38px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin:2px 0 0;line-height:1}
.hero-d{color:var(--muted);font-size:13px;margin-top:4px}
.hero-c{color:var(--ink);font-size:12.5px;margin-top:6px;font-weight:500}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero-stats span{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--g1) 20%,#fff);color:var(--g1);border-radius:20px;padding:4px 12px;font-size:12.5px}
.hero-stats b{font-weight:700}
.hero-act{display:flex;gap:10px;align-items:center;position:relative;z-index:1}
.hero-btn{background:var(--grad);color:#fff;border-color:transparent}
.hero .bell{color:var(--g1)}
.hero-bub{position:absolute;right:-30px;bottom:-50px;width:240px;opacity:.12;pointer-events:none;color:var(--g1)}
@media (max-width:860px){.hero{flex-direction:column;text-align:center;gap:12px;padding:20px 16px}.hero-logo{width:70%;max-width:260px}.hero-stats{justify-content:center}.hero-act{display:none}.hero h1{font-size:30px}}
.fin-t td{padding:9px 16px}

  if(it.kind==="carpet" && it.ctype){ return Math.round(basePrice(it) * Math.max(1,num(it.qty)||1) * (it.express ? num(it.mult||S.settings.expressMult||2) : 1)); }

}

let DB = null;
const writeChains = {};

function showToast(msg){
  const t = $("#toast"); t.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>{ t.innerHTML=""; }, 2600);
}
function handleWriteError(e){
  const code = e && e.code;
  if(code==="permission-denied"){ showToast("You don't have permission to do that."); }
  else if(code==="invalid_argument"){ S.readOnly = true; showToast("You have view-only access — changes can't be saved."); render(); }
  else if(code==="quota_exceeded"){ showToast("Storage is full: "+(e.message||"delete old records to continue.")); }
  else if(code==="revoked"){ S.readOnly = true; render(); }
  else { showToast("Couldn't save — please try again."); }
  console.warn(e);
}
function queueWrite(path, fn){
  const prev = writeChains[path] || Promise.resolve();
  const p = prev.catch(()=>{}).then(fn).catch(async e=>{
    if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r, 600+Math.random()*900)); return fn(); }
    throw e;
  }).catch(handleWriteError);
  writeChains[path] = p; return p;
}
function upsertLocal(arr, obj){ const i=arr.findIndex(x=>x.id===obj.id); if(i>=0) arr[i]=obj; else arr.push(obj); }
const store = {
  put(col, obj){
    if(S.readOnly){ showToast("View-only access — not saved."); return Promise.resolve(); }
    const clean = JSON.parse(JSON.stringify(obj));
    upsertLocal(S[col], clean); render(); refreshModal();
    if(S.mode!=="db") return Promise.resolve();
    return queueWrite(col+"/"+obj.id, ()=>DB.collection(col).doc(obj.id).set(clean));
  },
  del(col, id){
    if(S.readOnly){ showToast("View-only access — not saved."); return Promise.resolve(); }
    S[col] = S[col].filter(x=>x.id!==id); render(); refreshModal();
    if(S.mode!=="db") return Promise.resolve();
    return queueWrite(col+"/"+id, ()=>DB.collection(col).doc(id).delete());
  },
  saveSettings(st){
    if(S.readOnly){ showToast("View-only access — not saved."); return Promise.resolve(); }
    S.settings = JSON.parse(JSON.stringify(st)); render();
    if(S.mode!=="db") return Promise.resolve();
    const w = queueWrite("config/settings", ()=>DB.doc("config/settings").set(S.settings));
    if(S.role==="admin") queueWrite("public/site", ()=>DB.doc("public/site").set(publicSite(S.settings)));
    return w;
  }
};

async function init(){
  render();
  let db = null;
  try { db = window.claude && typeof window.claude.use==="function" ? await window.claude.use("db") : null; } catch(e){ db = null; }
  if(!db){ S.mode = "memory"; Object.keys(S.loaded).forEach(k=>S.loaded[k]=true); render(); return; }
  DB = db; S.mode = "db";
  claude.use("sample").then(async sm=>{ try{ if(sm && (await sm.limits()).images){ S.canScan=true; } }catch(_){} });
  const timer = setTimeout(()=>{ S.stale = true; Object.keys(S.loaded).forEach(k=>S.loaded[k]=true); render(); }, 10000);
  const done = () => { if(Object.values(S.loaded).every(Boolean)) clearTimeout(timer); };
  const onErr = key => e => { console.warn(key, e); S.loaded[key]=true; if(e && e.code==="revoked") S.readOnly=true; else S.stale=true; render(); };
  ["customers","orders","expenses","fin"].forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      S[col] = snap.docs.filter(d=>d.exists).map(d=>({...structuredClone(d.data()), id:d.id}));
      if(!snap.metadata.fromCache){ S.loaded[col]=true; S.stale=false; done(); }
      else if(snap.size) S.loaded[col]=true;
      render(); refreshModal();
    }, onErr(col));
  });
  db.doc("config/settings").onSnapshot(snap=>{
    if(snap.exists){ const sv = structuredClone(snap.data()); const st = {...structuredClone(DEFAULT_SETTINGS), ...sv};
      if((sv.brandV||0)<3){ st.brandV=3; if(!sv.phone) st.phone=DEFAULT_SETTINGS.phone; if(!sv.address || /^P\.O\. Box/i.test(sv.address)) st.address=DEFAULT_SETTINGS.address; if(!sv.postal) st.postal=DEFAULT_SETTINGS.postal; }
      if(/Darusunna Primary School/i.test(st.address||"")) st.address = st.address.replace(/Darusunna Primary School/i,"Darul Sunnah School");
      if(!sv.brandV){ st.theme=DEFAULT_SETTINGS.theme; if(!sv.businessName || sv.businessName==='Cloth & Carpet Cleaning') st.businessName=DEFAULT_SETTINGS.businessName; if(!sv.address) st.address=DEFAULT_SETTINGS.address; }
      S.settings = st; }
    if(!snap.metadata.fromCache){ S.loaded.settings=true; done(); }
    render();
  }, onErr("settings"));
}

// where a mixed order sits on the cloth or carpet board (e.g. "Drying" shows under Cleaning on the cloth board)
function boardCol(o, service){ if(DONE.includes(o.status)) return "Done"; if(FLOW[service].includes(o.status)) return o.status; return o.status==="Ready" ? "Ready" : "Cleaning"; }
function boardView(service){
  const cols = [...FLOW[service], "Done"];
  const os = S.orders.filter(o=>service==="carpet"?hasCarpet(o):hasCloth(o));
  const recentDone = os.filter(o=>DONE.includes(o.status)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,10);
  const colHtml = cols.map(c=>{
    const items = c==="Done" ? recentDone : os.filter(o=>boardCol(o,service)===c).sort((a,b)=>(a.expected||"").localeCompare(b.expected||""));
    return `<div class="col"><h3>${c==="Done"?"Collected / Delivered":c}<span class="n">${c==="Done"?os.filter(o=>DONE.includes(o.status)).length:items.length}</span></h3>
      ${items.map(o=>ticket(o)).join("") || `<div class="muted small" style="padding:6px 4px">—</div>`}
      ${c==="Done"&&recentDone.length?`<div class="muted small" style="padding:2px 4px">Latest 10 shown</div>`:""}</div>`;
  }).join("");
  const isC = service==="carpet";
  const title = isC ? "Carpet Cleaning" : "Cloth Cleaning";
  const sub = isC ? `Received → Cleaning → Drying → Ready → Collected/Delivered · Corridor ${money(S.settings.corridorRate)}/m · Express ×${num(S.settings.expressMult)||2}`
                  : "Received → Cleaning → Ironing → Ready → Collected/Delivered";
  let extra = "";
  if(isC){
    const active = os.filter(o=>!DONE.includes(o.status));
    const carpets = active.reduce((s,o)=>s+(o.items||[]).filter(i=>i.kind==="carpet").reduce((a,i)=>a+(Math.max(1,num(i.qty)||1)),0),0);
    const xp = active.reduce((s,o)=>s+(o.items||[]).filter(i=>i.express).length,0);
    const cm = active.reduce((s,o)=>s+(o.items||[]).filter(i=>i.ctype==="corridor").reduce((a,i)=>a+num(i.metres)*(Math.max(1,num(i.qty)||1)),0),0);
    extra = `<div class="kpis"><div class="kpi"><div class="l">Carpets in process</div><div class="v">${carpets}</div><div class="d">${xp} express</div></div><div class="kpi"><div class="l">Corridor metres</div><div class="v">${cm.toLocaleString("en-KE",{maximumFractionDigits:1})} m</div></div><div class="kpi"><div class="l">Value in process</div><div class="v">${money(active.reduce((s,o)=>s+subtotal(o),0))}</div></div></div>`;
  } else {
    const active = os.filter(o=>!DONE.includes(o.status));
    const pcs = active.reduce((s,o)=>s+(o.items||[]).filter(i=>i.kind!=="carpet").reduce((a,i)=>a+num(i.qty),0),0);
    extra = `<div class="kpis"><div class="kpi"><div class="l">Garments in process</div><div class="v">${pcs}</div></div><div class="kpi"><div class="l">Orders in process</div><div class="v">${active.length}</div></div><div class="kpi"><div class="l">Value in process</div><div class="v">${money(active.reduce((s,o)=>s+subtotal(o),0))}</div></div></div>`;
  }
  return topbar(title, sub, S.readOnly?"":`<button class="btn pri hide-m" data-act="new-order" data-svc="${service}">${ic("plus")} New ${isC?"carpet":"cloth"} order</button>`) + extra + `<div class="board ${isC?"carpet-o":""}">${colHtml}</div>`;
}
function ticket(o){

  const desc = o.service!=="cloth"
    ? (o.items||[]).map(i=> i.kind!=="carpet" ? `${num(i.qty)} ${esc(i.type||i.desc||"item")}` : i.ctype ? `${esc(carpetName(i))}${i.express?" <span class=\"xchip\">EXP</span>":""}${num(i.qty)>1?` ×${num(i.qty)}`:""}` : `${esc(i.label||"Carpet")} ${num(i.length)}×${num(i.width)}m${num(i.qty)>1?` ×${num(i.qty)}`:""}`).join(", ")
    : (o.items||[]).map(i=>`${num(i.qty)} ${esc(i.type||i.desc||"item")}`).join(", ");
  return `<div class="tk" data-order="${o.id}">
    <div class="t1"><span>${esc(o.no)}</span><span>${money0(orderTotal(o))}</span></div>
    <div class="t2">${esc(o.customerName)}</div>

    <div class="t3"><span class="small ${isLate(o)?"late":"muted"}">${DONE.includes(o.status)?fmtShort(o.completedDate||o.expected):"Due "+fmtShort(o.expected)}</span>
    ${n && !S.readOnly ? `<button class="btn sm" data-advance="${o.id}">→ ${n}</button>` : pchip(o)}</div>
  </div>`;
}

function rangeDates(key, from, to){
  const t = new Date(); const T = today();
  if(key==="today") return [T,T];
  if(key==="week"){ const d=new Date(); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return [isoDate(d),T]; }
  if(key==="month") return [isoDate(new Date(t.getFullYear(),t.getMonth(),1)), T];
  if(key==="lastmonth") return [isoDate(new Date(t.getFullYear(),t.getMonth()-1,1)), isoDate(new Date(t.getFullYear(),t.getMonth(),0))];
  if(key==="year") return [isoDate(new Date(t.getFullYear(),0,1)), T];
  if(key==="custom") return [from||"0000-01-01", to||"9999-12-31"];
  return ["0000-01-01","9999-12-31"];
}
const RANGES = [["today","Today"],["week","This week"],["month","This month"],["lastmonth","Last month"],["year","This year"],["all","All time"]];
function allPayments(){
  const out=[]; S.orders.forEach(o=>(o.payments||[]).forEach(p=>out.push({...p, order:o}))); return out.sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.at||0)-(a.at||0));
}

VIEWS.reports = () => {
  const u = S.ui; const [a,b] = rangeDates(u.repRange, u.repFrom, u.repTo);
  const inR = d => d && d>=a && d<=b;

function barChart(data, title){
  if(!data.length || data.every(d=>!d[1])) return {title, svg:""};
  const W=760, H=230, pl=56, pb=34, pt=14, pr=10; const max=Math.max(...data.map(d=>d[1]))||1;
  const nice = (()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); const m=max/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; })();
  const bw=(W-pl-pr)/data.length; const y=v=>pt+(H-pt-pb)*(1-v/nice);
  let g=""; for(let i=0;i<=4;i++){ const v=nice*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e6edf1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5f7180">${v>=1000?(v/1000).toLocaleString("en-KE",{maximumFractionDigits:1})+"k":v}</text>`; }
  const step = Math.ceil(data.length/12);
  const bars = data.map(([l,v],i)=>{ const x=pl+i*bw; const h=(H-pt-pb)-(y(v)-pt); return `<rect x="${x+bw*.15}" y="${y(v)}" width="${Math.max(1,bw*.7)}" height="${Math.max(0,h)}" rx="3" fill="url(#bargrad)"><title>${esc(l)}: KSh ${money0(v)}</title></rect>${i%step===0?`<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="11" fill="#5f7180">${esc(l)}</text>`:""}`; }).join("");
  return {title, svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><defs><linearGradient id="bargrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--g2)" style="stop-color:var(--g2)"/><stop offset="1" stop-color="var(--g1)" style="stop-color:var(--g1)"/></linearGradient></defs>${g}${bars}</svg>`};
}

function readyMsg(o){

  return `Hello ${o.customerName}, your ${svcWords(o)} (order ${o.no}) ${o.delivery&&o.delivery.required?"are ready and will be delivered soon":"are ready for collection"}. Total ${money(orderTotal(o))}, balance ${money(balanceOf(o))}. Thank you — ${st.businessName}${st.phone?" ("+st.phone+")":""}.`;
}
function receiptText(o){
  const st=S.settings; const L="--------------------------------";
  const lines=[st.businessName.toUpperCase()]; if(st.address) lines.push(st.address); if(st.postal) lines.push(st.postal); if(st.phone) lines.push("Tel: "+st.phone);
  lines.push(L, `Receipt: ${o.no}`, `Date: ${fmtDate(o.dateReceived)}`, `Customer: ${o.customerName}`, `Phone: ${o.customerPhone||"-"}`, `Service: ${svcName(o)}`, L);
  (o.items||[]).forEach(i=>{
    if(i.kind==="carpet" && i.ctype) lines.push(`${i.label?i.label+" ":""}${carpetLabel(i)}${num(i.qty)>1?" x"+num(i.qty):""}`, `   = KSh ${money0(lineTotal(i))}`);
    else if(i.kind==="carpet") lines.push(`${i.label||"Carpet"} ${num(i.length)}m x ${num(i.width)}m = ${carpetArea(i)}m2${num(i.qty)>1?" x"+num(i.qty):""} @${money0(i.rate)}`, `   = KSh ${money0(lineTotal(i))}`);
    else lines.push(`${num(i.qty)} x ${i.type||"Item"}${itemNote(i)?" ("+itemNote(i)+")":""} @${money0(i.price)}`, `   = KSh ${money0(lineTotal(i))}`);
  });
  lines.push(L);
  if(delFee(o)) lines.push(`Delivery: KSh ${money0(delFee(o))}`);
  if(num(o.discount)) lines.push(`Discount: -KSh ${money0(o.discount)}`);
  lines.push(`TOTAL:   KSh ${money0(orderTotal(o))}`, `PAID:    KSh ${money0(paidOf(o))}`, `BALANCE: KSh ${money0(balanceOf(o))}`, L, `Status: ${o.status}`, `Ready by: ${fmtDate(o.expected)}`, "", "Thank you for your business!");
  return lines.join("\n");
}
function openReceipt(o){

  <div class="md-f"><button class="btn" id="rc-copy">${ic("copy",15)} Copy</button>${waNum(o)?`<a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/${waPhone(waNum(o))}?text=${encodeURIComponent(txt)}">${ic("wa",15)} Send on WhatsApp</a>`:""}</div>`, true, "#modal2");
  $("#rc-copy").onclick = () => copyText(txt);
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); showToast("Copied"); }
  catch(e){ const r=document.createRange(); const el=$("#rc-text")||document.body; r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); showToast("Text selected — copy it from your device menu"); }
}

/* ---- status changes ---- */
function setStatus(o, status){
  const n = structuredClone(o); n.status = status; n.updatedAt = Date.now();
  if(DONE.includes(status)){ n.completedDate = n.completedDate || today(); } else delete n.completedDate;
  if(n.delivery && n.delivery.required){
    if(status==="Delivered"){ n.delivery.status="Delivered"; n.delivery.deliveredDate = n.delivery.deliveredDate || today(); }
    else if(n.delivery.status==="Delivered"){ n.delivery.status="Pending"; delete n.delivery.deliveredDate; }
  }
  addHistory(n, {type:"status", status}); const evAt = n.history[n.history.length-1].at;
  store.put("orders", n);
  showToast(`${o.no} → ${status}`);
  openNotify(n.id, status, 0, evAt);
}

  const out = [], seen = new Set();
  (S.settings.clothPrices||[]).forEach(p=>{ const k=(p.name||"").trim().toLowerCase(); if(k && !seen.has(k)){ seen.add(k); out.push({name:p.name.trim(), price:num(p.price)}); } });
  const used = [];
  [...(S.orders||[])].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(o=>(o.items||[]).forEach(i=>{ if(i.kind!=="cloth") return; const n=String(i.type||"").trim(), k=n.toLowerCase(); if(n && !seen.has(k)){ seen.add(k); used.push({name:n, price:num(i.price), used:true}); } }));

function readDraft(){
  const fm = $("#order-form"); if(!fm) return;
  $$(".irow[data-i]", fm).forEach(row=>{
    const it = draft.items[+row.dataset.i]; if(!it) return;
    $$("[data-k]", row).forEach(inp=>{ const k=inp.dataset.k; if(inp.disabled) return; if(inp.type==="checkbox"){ it[k]=inp.checked; if(k==="express") it.mult = num(S.settings.expressMult)||2; return; } it[k] = ["qty","price","rate","metres","length","width"].includes(k) ? (inp.value===""?"":num(inp.value)) : inp.value; });
    const lt = $("[data-lt]", row); if(lt) lt.textContent = money0(lineTotal(it));
    const pr = $("[data-k=price][disabled]", row); if(pr) pr.value = basePrice(it);
  });
  draft.delivery.required = fm.delReq.checked;
  draft.delivery.location = fm.delLoc.value; draft.delivery.fee = num(fm.delFee.value); draft.delivery.driver = fm.delDriver.value;
  draft.discount = num(fm.discount.value);
}

  const pcs = draft.items.reduce((s,i)=>s+(Math.max(1,num(i.qty)||1)),0), xp = draft.items.filter(i=>i.express).length;
  box.innerHTML = `
    <div class="r"><span>${draft.service==="carpet"?`${pcs} piece(s)${xp?` · ${xp} express`:""}`:draft.service==="mixed"?`${draft.items.filter(i=>i.kind!=="carpet").reduce((s,i)=>s+num(i.qty),0)} item(s) + ${draft.items.filter(i=>i.kind==="carpet").reduce((s,i)=>s+Math.max(1,num(i.qty)||1),0)} carpet(s)`:`${draft.items.reduce((s,i)=>s+num(i.qty),0)} item(s)`}</span><span>${money(subtotal(draft))}</span></div>
    ${delFee(draft)?`<div class="r"><span>Delivery</span><span>${money(delFee(draft))}</span></div>`:""}
    ${num(draft.discount)?`<div class="r"><span>Discount</span><span>− ${money(draft.discount)}</span></div>`:""}
    <div class="r big"><span>Total</span><span>${money(tot)}</span></div>
    <div class="r"><span>Paid</span><span>${money(pay)}</span></div>

function bindOrderForm(){

  const sel = $("#cust-sel");

    $("#items-title").style.display = s==="carpet"?"none":"";
    $("#add-item").style.display = s==="carpet" ? "none" : "";
    $("#add-garment").style.display = s==="carpet" ? "none" : "";
    renderItems(); updateSum();
  });
  $("#add-garment").onclick = () => { readDraft(); const it={kind:"cloth", type:"", desc:"", qty:1, price:"", _new:true}; const blank=draft.items.findIndex(i=>i.kind==="cloth"&&!i._new&&!String(i.desc||"").trim()&&draft.items.length===1&&num(i.qty)===1); if(blank===0) draft.items[0]=it; else draft.items.push(it); renderItems(); updateSum(); const rows=$$(".irow[data-i] .gnew input"); const ni=rows[rows.length-1]; ni&&ni.focus(); };
  $("#add-item").onclick = () => { readDraft(); draft.items.push(blankItem(draft.service)); renderItems(); updateSum(); const rows=$$("#items .irow[data-i]"); const last=rows[rows.length-1]; if(last){ const f=$("[data-k=desc]",last)||$("input",last); f&&f.focus(); } };
  onItems("click", e => { const b=e.target.closest("[data-rm]"); if(!b) return; readDraft(); draft.items.splice(+b.dataset.rm,1); if(!draft.items.length && draft.service==="cloth") draft.items.push(blankItem("cloth")); renderItems(); updateSum(); });

      if(s.value==="__new"){ readDraft(); const it=draft.items[+row.dataset.i]; it._new=true; it.type=""; it.price=""; renderItems(); updateSum(); const ni=$(`.irow[data-i="${row.dataset.i}"] [data-k=type]`); ni&&ni.focus(); return; }
      const p=garmentList().find(x=>x.name===s.value); if(p && row){ $("[data-k=price]",row).value=p.price; } }

  fm.onsubmit = e => { e.preventDefault(); saveOrder(); };
}
function saveOrder(){
  readDraft(); const fm = $("#order-form");
  let cust = custById(fm.customerId.value);
  if(!cust){
    const name = fm.nc_name.value.trim(); const phone = fm.nc_phone.value.trim();
    if(!name){ showToast("Enter the customer's name or choose an existing customer"); fm.nc_name.focus(); return; }
    const dup = phone && S.customers.find(x=>waPhone(x.phone)===waPhone(phone));
    if(dup) cust = dup;
    else { let whatsapp = fm.nc_wa.value.trim(); if(whatsapp && waPhone(whatsapp)===waPhone(phone)) whatsapp = "";
      cust = {id:uid(), code:nextCustCode(), name, phone, whatsapp, location:fm.nc_location.value.trim(), createdAt:Date.now()}; store.put("customers", cust); }
  }
  const items = draft.items.filter(i => i.kind==="carpet" ? (i.ctype==="corridor" ? num(i.metres)>0 : i.ctype==="custom" ? (num(i.length)>0 && num(i.width)>0) : true) : num(i.qty)>0);
  if(!items.length){ showToast(draft.service==="carpet"?"Tap a carpet size to add at least one carpet":draft.service==="mixed"?"Add at least one garment or carpet":"Add at least one item"); return; }
  if(items.length < draft.items.length){ showToast("Fill in the size of every corridor / custom carpet, or remove it"); return; }
  const unnamed = items.find(i=>i.kind==="cloth" && !String(i.type||"").trim());
  if(unnamed){ showToast("Type the name of the new garment"); const r=$$(".irow[data-i] .gnew input").find(x=>!x.value.trim()); r&&r.focus(); return; }
  items.forEach(i=>{ if(i.kind==="cloth") i.type = String(i.type).trim().replace(/\s+/g," "); });
  const known = new Set((S.settings.clothPrices||[]).map(p=>p.name.trim().toLowerCase()));
  const fresh = []; items.forEach(i=>{ if(i.kind==="cloth" && i._new && !known.has(i.type.toLowerCase())){ known.add(i.type.toLowerCase()); fresh.push({name:i.type, price:num(i.price)}); } });
  if(fresh.length && S.role==="admin" && !S.readOnly){ store.saveSettings({...S.settings, clothPrices:[...(S.settings.clothPrices||[]), ...fresh]}); }
  const o = structuredClone(draft); delete o._edit;
  { const kinds = new Set(items.map(i=>i.kind==="carpet"?"carpet":"cloth")); o.service = kinds.size===2 ? "mixed" : kinds.has("carpet") ? "carpet" : "cloth"; }
  o.items = items.map(i => i.kind==="carpet" ? JSON.parse(JSON.stringify({kind:"carpet", ctype:i.ctype, label:i.label||"", desc:i.desc||"", color:i.color||undefined, size:i.size, name:i.name, metres:i.metres!==undefined?num(i.metres):undefined, length:i.length!==undefined?num(i.length):undefined, width:i.width!==undefined?num(i.width):undefined, rate:i.rate!==undefined?num(i.rate):undefined, price:basePrice(i), qty:Math.max(1,num(i.qty)||1), express:!!i.express, mult:i.express?num(i.mult||S.settings.expressMult||2):undefined})) : {kind:"cloth", type:i.type, desc:i.desc||"", color:i.color||"", qty:num(i.qty), price:num(i.price)});
  delete o._mode;
  o.customerId = cust.id; o.customerName = cust.name; o.customerPhone = cust.phone||""; o.customerWa = cust.whatsapp||"";
  o.dateReceived = fm.dateReceived.value || today(); o.expected = fm.expected.value || o.dateReceived;
  o.notes = fm.notes.value.trim();
  if(!o.delivery.required){ o.delivery = {required:false, location:"", fee:0, driver:"", status:"Pending"}; }
  // keep status valid for the chosen service
  if(!flowOf(o).includes(o.status)) o.status = DONE.includes(o.status) ? flowOf(o).slice(-1)[0] : "Received";
  if(!draft._edit){
    o.no = nextOrderNo(); o.createdAt = Date.now();
    const amt = fm.payAmt ? num(fm.payAmt.value) : 0;
    if(amt>0) o.payments = [{id:uid(), amount:amt, method:fm.payMethod.value, ref:fm.payRef.value.trim(), date:o.dateReceived, at:Date.now()}];
    o.history = [{at:Date.now(), type:"status", status:"Received"}];
    if(amt>0) o.history.push({at:Date.now()+1, type:"payment", amount:amt, method:fm.payMethod.value});
  }
  o.updatedAt = Date.now();
  store.put("orders", o);
  closeModal("#modal2"); showToast(draft._edit ? "Order updated" : `Order ${o.no} saved`);
  const wasEdit = draft._edit; draft = null;
  openOrder(o.id);
  if(!wasEdit){ if(S.settings.notifyEveryStep) openNotify(o.id, "Received", 0, o.history[0].at); else offerReceipt(o, `Order ${o.no} saved`); }
}

function reportText(){
  const u=S.ui; const [a,b]=rangeDates(u.repRange,u.repFrom,u.repTo); const inR=d=>d&&d>=a&&d<=b;
  const pays=allPayments().filter(p=>inR(p.date)); const sales=pays.reduce((s,p)=>s+num(p.amount),0);
  const exp=S.expenses.filter(e=>inR(e.date)).reduce((s,e)=>s+num(e.amount),0);

  return [`${S.settings.businessName} — Report (${label})`,

const STAGE_TEXT = {
  Received: o => `we have received your ${svcWords(o)} (${itemCount(o)} item${itemCount(o)===1?"":"s"}). Order ${o.no}. Total ${money(orderTotal(o))}, paid ${money(paidOf(o))}, balance ${money(balanceOf(o))}. Expected ready: ${fmtDate(o.expected)}.`,
  Cleaning: o => `your ${svcWords(o)} (order ${o.no}) are now being cleaned.`,
  Ironing: o => `your clothes (order ${o.no}) are washed and now being ironed and finished.${o.service==="mixed"?" Your carpet(s) are washed and drying.":""}`,
  Drying: o => `your carpet(s) (order ${o.no}) are washed and now drying.`,
  Ready: o => `your ${svcWords(o)} are READY (order ${o.no}). ${o.delivery&&o.delivery.required?"We will deliver to "+(o.delivery.location||"you")+" soon.":"You can collect them at our shop."} Balance to pay: ${money(balanceOf(o))}.`,
  Collected: o => `thank you for collecting your order ${o.no}. ${balanceOf(o)>0?"Remaining balance: "+money(balanceOf(o))+".":"Fully paid."} We hope to serve you again!`,
  Delivered: o => `your order ${o.no} has been delivered. ${balanceOf(o)>0?"Remaining balance: "+money(balanceOf(o))+".":"Fully paid."} Thank you for choosing us!`
};
function stageMsg(o, kind, amount){
  const st = S.settings; const sign = `\n\n— ${st.businessName}${st.phone?" · "+st.phone:""}`;
  if(kind==="payment") return `Hello ${o.customerName}, we have received your payment of ${money(amount)} for order ${o.no}. Total ${money(orderTotal(o))}, paid ${money(paidOf(o))}, balance ${money(balanceOf(o))}.${sign}`;
  const f = STAGE_TEXT[kind]; return `Hello ${o.customerName}, ${f?f(o):"your order "+o.no+" is now "+kind+"."}${sign}`;
}
// WhatsApp goes to the customer's WhatsApp number if one is saved, otherwise their phone
function waNum(o){ const c = o && o.customerId ? custById(o.customerId) : null; return (c && (c.whatsapp||"").trim()) || (o && o.customerWa) || (o && o.customerPhone) || ""; }
const waLink = (o, text) => `https://wa.me/${waPhone(waNum(o))}?text=${encodeURIComponent(text)}`;
function addHistory(o, ev){ o.history = [...(o.history||[]), {at:Date.now(), by:(S.profile&&S.profile.name)||"", ...ev}]; }
function openNotify(orderId, kind, amount, evAt){
  if(!S.settings.notifyEveryStep) return;
  const o = orderById(orderId); if(!o) return;
  const msg = stageMsg(o, kind, amount);
  const title = kind==="payment" ? "Payment recorded" : `${o.no} is now ${kind}`;

  <div class="md-b"><div class="notify"><div class="msg">${esc(msg)}</div></div>
  ${waNum(o)?"":`<div class="banner" style="margin:12px 0 0">This customer has no phone number. Add one on the customer's page to send updates.</div>`}</div>
  <div class="md-f"><button class="btn" data-close2>Skip</button>${(kind==="payment"||kind==="Received"||DONE.includes(kind))?`<button class="btn" data-pdf="send|${o.id}">${ic("pdf",15)} Send ${balanceOf(o)>0?"invoice":"receipt"} PDF</button>`:""}${o.customerPhone?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(o,msg)}" data-wasent="${o.id}|${evAt||""}">${ic("wa",16)} Send on WhatsApp</a>`:""}</div>`, true, "#modal2");
}

}
function markWaSent(orderId, evAt){
  const o = orderById(orderId); if(!o) return;
  const n = structuredClone(o); n.history = n.history||[];
  const ev = evAt ? n.history.find(h=>String(h.at)===String(evAt)) : null;

function historyHtml(o){
  const h = [...(o.history||[])].sort((a,b)=>b.at-a.at);

function evText(e){
  if(e.type==="status") return e.status==="Received" ? "Order received" : `Moved to ${e.status}`;

async function stampCanvas(N=900, dateStr, word, rotate=0, texts){
  try{ await document.fonts.load(`800 ${Math.round(N*.08)}px 'Roboto Slab'`); }catch(_){}
  const cv = document.createElement("canvas"); cv.width=cv.height=N; const x = cv.getContext("2d");
  const c=N/2, F="'Roboto Slab', Georgia, serif", ink="#0e1d18";
  x.translate(c,c); x.rotate(rotate*Math.PI/180); x.translate(-c,-c);
  x.fillStyle=ink; x.beginPath(); x.arc(c,c,N*.485,0,Math.PI*2); x.fill();
  x.strokeStyle="#fff";
  [[.452,N*.014],[.423,N*.006],[.292,N*.009]].forEach(([r,w])=>{ x.lineWidth=w; x.beginPath(); x.arc(c,c,N*r,0,Math.PI*2); x.stroke(); });
  x.fillStyle="#fff"; x.textAlign="center"; x.textBaseline="middle";
  const arcText = (txt, r, size, top, maxAng) => {
    x.font = `800 ${size}px ${F}`; let sp = size*.06;
    let ws = [...txt].map(ch=>x.measureText(ch).width+sp);
    const span = (ws.reduce((a,b)=>a+b,0)-sp)/r;
    if(span > maxAng){ size *= maxAng/span; x.font = `800 ${size}px ${F}`; sp = size*.06; ws = [...txt].map(ch=>x.measureText(ch).width+sp); } const tot = ws.reduce((a,b)=>a+b,0)-sp; let ang = (top?-Math.PI/2:Math.PI/2) + (top?-1:1)*tot/r/2;
    [...txt].forEach((ch,i)=>{ const a = ang + (top?1:-1)*(ws[i]-sp)/r/2; x.save(); x.translate(c+r*Math.cos(a), c+r*Math.sin(a)); x.rotate(top?a+Math.PI/2:a-Math.PI/2); x.fillText(ch,0,0); x.restore(); ang += (top?1:-1)*ws[i]/r; });
  };
  const tx = texts || S.settings; const top = (tx.stampTop||"SUFAAT LAUNDRY").toUpperCase(), bot = (tx.stampBottom||"").toUpperCase();
  arcText(top, N*.355, N*.086, true, 2.35);
  arcText(bot, N*.362, N*.062, false, 3.0);
  const star = (a) => { const px=c+N*.358*Math.cos(a), py=c+N*.358*Math.sin(a), R=N*.026; x.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?R*.45:R, t=-Math.PI/2+i*Math.PI/5; x.lineTo(px+rr*Math.cos(t), py+rr*Math.sin(t)); } x.closePath(); x.fill(); };
  star(Math.PI*1.07); star(-Math.PI*.07);
  x.font = `700 ${N*.034}px Inter, Arial, sans-serif`; x.fillText("D R Y C L E A N E R S", c, c-N*.155);
  x.font = `800 ${N*.082}px ${F}`; x.fillText(dateStr, c, c-N*.035);
  x.fillRect(c-N*.2, c+N*.03, N*.4, N*.006);
  if(word){ x.font = `800 ${N*.07}px ${F}`; x.fillText(word, c, c+N*.11); }
  else { x.font = `700 ${N*.03}px Inter, Arial, sans-serif`; x.fillText("EASTLEIGH · NAIROBI", c, c+N*.09); }
  return cv;
}

const _mc = document.createElement("canvas").getContext("2d");
function pdfStr(s){ return String(s??"").replace(/[–—]/g,"-").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,"...").replace(/·/g,"\xB7").replace(/[^\x20-\x7E\xA0-\xFF]/g,"?"); }
class Pdf {
  constructor(){ this.W=595.28; this.H=841.89; this.pages=[]; this.imgs=[]; this.addPage(); }
  addPage(){ this.cur=[]; this.pages.push(this.cur); }
  rgb(h){ h=h.replace("#",""); return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(" "); }
  rect(x,y,w,h,fill){ this.cur.push(`${this.rgb(fill)} rg ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); }

    this.cur.push(`BT /F${o.bold?2:1} ${size} Tf ${this.rgb(o.color||"#16241f")} rg ${x.toFixed(2)} ${(this.H-y).toFixed(2)} Td (${e}) Tj ET`); return w; }

    const parts=[], offs=[]; let len=0; const push=u=>{ parts.push(u); len+=u.length; };
    const objs=[]; const obj = body => { objs.push(body); return objs.length; };
    const fonts=[obj(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`), obj(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`)];
    const imgIds=this.imgs.map(im=>obj({img:im}));
    const pagesId = objs.length + 1 + this.pages.length*2; // reserved after pages

    const cat=obj(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);

    objs.forEach((b,i)=>{ offs.push(len); if(b.img){ push(enc(`${i+1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${b.img.w} /Height ${b.img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${b.img.bytes.length} >>\nstream\n`)); push(b.img.bytes); push(enc("\nendstream\nendobj\n")); } else push(enc(`${i+1} 0 obj\n${b}\nendobj\n`)); });

  }
}

function finEntries(){ // every money movement, oldest first
  const out = [];
  S.orders.forEach(o=>(o.payments||[]).forEach(p=>out.push({date:p.date, at:p.at||0, method:p.method||"Cash", amt:num(p.amount), dir:1, kind:"Sale", desc:`${o.no} · ${o.customerName}`, svc:o.service, order:o.id})));

function pnl(a,b){

function pairChart(rows){ // rows: [label, income, expense]

  S.user = u; S.mode = "loading"; renderLoading(); idleStart();
  let p = null;
  try{ const snap = await DB.doc("users/"+u.uid).get(); p = snap.exists ? snap.data() : null; }catch(e){ console.warn(e); }
  const email = (u.email||"").toLowerCase();
  if(!p && ADMIN_EMAILS.includes(email)){
    p = {role:"admin", name:"Admin", email, active:true, createdAt:Date.now()};
    try{ await DB.doc("users/"+u.uid).set(p); }catch(e){ console.warn(e); }
  }
  if(p && p.selfSignup && !u.emailVerified){
    try{ await u.sendEmailVerification({url: location.origin + location.pathname}); }catch(_){}
    LOGIN.error = ""; LOGIN.info = `Confirm your Gmail first: we've sent a link to ${email}. Tap it (check Spam too), then sign in again.`;
    await AUTH.signOut(); return;
  }
  if(p && p.pending){
    LOGIN.error = ""; LOGIN.info = "Your account is waiting for the admin to approve it. Try again once they have.";
    await AUTH.signOut(); return;
  }
  if(!p || p.active===false){
    LOGIN.error = !p ? "This account hasn't been given access yet. Ask the admin to add you." : "This account has been switched off. Ask the admin.";
    await AUTH.signOut(); return;
  }
  S.role = ADMIN_EMAILS.includes(email) ? "admin" : (p.role||"staff");
  if(!ROLES[S.role]){ S.role=null; LOGIN.error = "This account type is no longer used. Ask the admin to set it to Staff."; await AUTH.signOut(); return; }
  S.profile = {...p, uid:u.uid, email};
  document.body.className = "role-"+S.role;
  if(!viewAllowed(S.view)) S.view = allowedViews()[0];
  subscribeData(); liveStart();
}
function subscribeData(){
  const cols = S.role==="admin" ? ["customers","orders","expenses","fin","users"] : ["customers","orders"];
  S.loaded = {customers:false,orders:false,expenses:false,fin:false,users:false,settings:false};
  Object.keys(S.loaded).forEach(k=>{ if(k!=="settings" && !cols.includes(k)) S.loaded[k]=true; });
  S.mode = "db"; S.stale = false;
  const timer = setTimeout(()=>{ if(!Object.values(S.loaded).every(Boolean)){ S.stale = true; Object.keys(S.loaded).forEach(k=>S.loaded[k]=true); render(); } }, 10000);
  const done = () => { if(Object.values(S.loaded).every(Boolean)) clearTimeout(timer); };
  const onErr = key => e => { console.warn(key, e); S.loaded[key]=true; if(!(e && e.code==="permission-denied")) S.stale=true; done(); render(); };
  cols.forEach(col=>{
    UNSUBS.push(DB.collection(col).onSnapshot(snap=>{
      S[col] = snap.docs.filter(d=>d.exists).map(d=>({...structuredClone(d.data()), id:d.id}));
      if(!snap.metadata.fromCache){ S.loaded[col]=true; S.stale=false; done(); }
      else if(snap.size) S.loaded[col]=true;
      render(); refreshModal();
    }, onErr(col)));
  });
  if(isOwnerUser()){
    UNSUBS.push(DB.collection("sessions").onSnapshot(snap=>{
      S.sessions = snap.docs.filter(d=>d.exists).map(d=>({...structuredClone(d.data()), id:d.id}));
      // tidy: forget sessions not seen for 7 days
      S.sessions.filter(x=>Date.now()-(x.lastSeen||0) > 7*864e5).forEach(x=>DB.doc("sessions/"+x.id).delete().catch(()=>{}));
      if(S.view==="live") render();
    }, e=>console.warn("sessions", e)));
    clearInterval(S._liveTick); S._liveTick = setInterval(()=>{ if(S.view==="live" && S.user && !document.querySelector(".ov")) render(); }, 30000);
  }
  UNSUBS.push(DB.doc("config/settings").onSnapshot(snap=>{
    if(snap.exists){ S.settings = {...structuredClone(DEFAULT_SETTINGS), ...structuredClone(snap.data())}; }
    if(S.role==="admin" && !snap.metadata.fromCache && !S._pubSynced){ S._pubSynced = true; DB.doc("public/site").set(publicSite(S.settings)).catch(e=>console.warn("public sync", e)); }
    if(!snap.metadata.fromCache || snap.exists){ S.loaded.settings=true; done(); }
    if(snap.exists && S.role==="admin" && !S.readOnly && !snap.metadata.fromCache && S.mode==="db") seedPrices();
    render();
  }, onErr("settings")));
  render();
}

// one-off price-list updates, applied once when an admin is signed in
const PRICE_SEEDS = {
  "duvet-sizes-2026-11": [{name:"Duvet 4×6",price:400},{name:"Duvet 5×6",price:400},{name:"Duvet 6×6",price:500},{name:"Children duvet",price:300}]
};
function seedPrices(){
  const st = S.settings, done = st.seeded||[]; const todo = Object.keys(PRICE_SEEDS).filter(k=>!done.includes(k));
  if(!todo.length || S._seeding || S.mode!=="db") return; S._seeding = true;
  let list = [...(st.clothPrices||[])];
  todo.forEach(k=>{
    const add = PRICE_SEEDS[k].filter(x=>!list.some(p=>p.name.trim().toLowerCase()===x.name.toLowerCase()));
    // the sized duvets replace the old single "Duvet" price
    const at = list.findIndex(p=>p.name.trim().toLowerCase()==="duvet");
    if(k.startsWith("duvet") && at>=0) list.splice(at, 1, ...add);
    else { const other = list.findIndex(p=>p.name.trim().toLowerCase()==="other"); if(other>=0) list.splice(other, 0, ...add); else list.push(...add); }
  });
  store.saveSettings({...st, clothPrices:list, seeded:[...done, ...todo]});
  setTimeout(()=>{ S._seeding = false; }, 3000);
}
function publicSite(st){
  return JSON.parse(JSON.stringify({

    updatedAt: Date.now()

}

async function signUp(e){
  e.preventDefault(); const f = e.target;
  const name = f.name.value.trim(), email = f.email.value.trim().toLowerCase(), pw = f.password.value, pw2 = f.password2.value;
  LOGIN.name = name; LOGIN.email = email; LOGIN.error = ""; LOGIN.info = "";
  if(name.length < 2){ LOGIN.error = "Enter your full name."; return renderLogin(); }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ LOGIN.error = "Enter a valid email address."; return renderLogin(); }
  if(pw.length < 8){ LOGIN.error = "Password must be at least 8 characters."; return renderLogin(); }
  if(!/[A-Za-z]/.test(pw) || !/\d/.test(pw)){ LOGIN.error = "Use letters and at least one number in the password."; return renderLogin(); }
  if(pw !== pw2){ LOGIN.error = "The two passwords don't match."; return renderLogin(); }
  LOGIN.busy = true; LOGIN.signingUp = true; renderLogin();
  try{
    const cred = await AUTH.createUserWithEmailAndPassword(email, pw);
    const u = cred.user;
    try{ await u.updateProfile({displayName:name}); }catch(_){}
    await DB.doc("users/"+u.uid).set({name, email, role:"staff", active:false, pending:true, selfSignup:true, createdAt:Date.now()});
    try{ await u.sendEmailVerification({url: location.origin + location.pathname}); }catch(err){ console.warn(err); }
    LOGIN.mode = "signin"; LOGIN.tab = "staff"; LOGIN.name = "";
    LOGIN.info = `Account created. We sent a confirmation link to ${email} — open your Gmail (check Spam too) and tap the link. Then the admin will approve your account and you can sign in.`;
  }catch(err){
    LOGIN.error = authMsg(err);
    try{ if(AUTH.currentUser) await AUTH.currentUser.delete(); }catch(_){}
  }
  LOGIN.busy = false; LOGIN.signingUp = false;
  if(AUTH.currentUser){ await AUTH.signOut(); } else renderLogin();
}
function authMsg(err){
  const c = (err && err.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "Wrong email or password.";
  if(/invalid-email/.test(c)) return "That email address doesn't look right.";
  if(/too-many-requests/.test(c)) return "Too many attempts. Wait a few minutes, or reset your password.";
  if(/network/.test(c)) return "No internet connection. Check it and try again.";
  if(/email-already-in-use/.test(c)) return "An account with this email already exists.";
  if(/weak-password/.test(c)) return "That password is too weak. Use at least 8 letters and numbers.";
  if(/permission-denied/.test(c)) return "The system isn't ready for new accounts yet — the admin needs to publish the latest Firebase rules. Try again later.";
  if(/operation-not-allowed|admin-restricted/.test(c)) return "Creating accounts is switched off. Ask the admin.";
  return "Couldn't sign in ("+c.replace("auth/","")+").";
}

/* browsers love to re-fill saved passwords; empty anything they fill in before the person types */
function blockAutofill(form){
  if(!form) return; let touched = false;
  const mark = () => { touched = true; };
  form.addEventListener("keydown", mark, true); form.addEventListener("paste", mark, true);
  const wipe = () => { if(touched) return; const pw = form.lg_key; if(pw && pw.value) pw.value = ""; if(form.lg_who && form.lg_who.value && form.lg_who.value !== (LOGIN.email||"")) form.lg_who.value = LOGIN.email||""; };
  [60, 400, 1200, 2500].forEach(ms => setTimeout(wipe, ms));
}

  </div><div class="md-f"><button type="button" class="btn" data-close2>Cancel</button><button class="btn pri" id="uf-save">Create account</button></div></form>`, true, "#modal2");
  $("#user-form").onsubmit = async ev => {
    ev.preventDefault(); const fd = new FormData(ev.target);
    const name=String(fd.get("name")).trim(), email=String(fd.get("email")).trim().toLowerCase(), pw=String(fd.get("pw")), role=String(fd.get("role"));
    const err = $("#uf-err"); const btn = $("#uf-save"); err.style.display="none";
    if(pw.length<6){ err.textContent="Password must be at least 6 characters."; err.style.display=""; return; }
    btn.disabled = true; btn.textContent = "Creating…";
    try{
      const sec = firebase.apps.find(a=>a.name==="secondary") || firebase.initializeApp(FIREBASE_CONFIG, "secondary");
      const cred = await sec.auth().createUserWithEmailAndPassword(email, pw);
      await DB.doc("users/"+cred.user.uid).set({name, email, role, active:true, createdAt:Date.now(), createdBy:S.profile.name||""});
      await sec.auth().signOut();
      closeModal("#modal2"); showToast(`${name}'s account created`);
    }catch(e){ err.textContent = authMsg(e); err.style.display=""; btn.disabled=false; btn.textContent="Create account"; }
  };
}

/* ---- downloads (browser) ---- */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; a.rel = "noopener"; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
}
function exportBackup(){
  const data = {exportedAt:new Date().toISOString(), settings:S.settings, customers:S.customers, orders:S.orders, expenses:S.expenses, fin:S.fin};
  downloadBlob(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}), `Sufaat-backup-${today()}.json`);
  showToast("Backup downloaded");
}

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const ov = t.classList && t.classList.contains("ov") ? t : null;
  if(ov){ closeModal(ov.dataset.ov); return; }
  if(t.closest("[data-close]")){ closeModal("#modal"); return; }
  if(t.closest("[data-close2]")){ closeModal("#modal2"); return; }
  const act = t.closest("[data-act]");
  if(act){
    const a = act.dataset.act;
    if(a==="drawer"){ S.drawer=true; render(); return; }
    if(a==="drawer-close"){ S.drawer=false; render(); return; }
    if(a==="new-order"){ if(act.dataset.cid) closeModal("#modal"); openOrderForm(null,{customerId:act.dataset.cid, service:act.dataset.svc || (S.view==="carpet"?"carpet":"cloth")}); return; }
    if(a==="new-cust"){ openCustForm(null); return; }
    if(a==="new-exp"){ openExpForm(null); return; }
    if(a==="copy-report"){ try{ await navigator.clipboard.writeText(reportText()); showToast("Report summary copied"); }catch(_){ showToast("Copy isn't available here"); } return; }
    if(a==="add-price"){ $("#price-rows").insertAdjacentHTML("beforeend", priceRow({name:"",price:""})); $$("#price-rows [data-pn]").pop().focus(); return; }
    if(a==="rm-price"){ act.closest(".pr").remove(); S.settingsDirty=true; return; }
    if(a==="rm-row"){ act.closest(".sr").remove(); S.settingsDirty=true; return; }
    if(a==="add-size"||a==="add-svc"){ $(a==="add-size"?"#size-rows":"#svc-rows").insertAdjacentHTML("beforeend", `<div class="split sr"><input class="inp" data-sn placeholder="${a==="add-size"?"e.g. 6×12":"Service"}"><input class="inp" type="number" min="0" data-sp style="max-width:120px" placeholder="Price"><button class="btn sm ghost" data-act="rm-row">✕</button></div>`); S.settingsDirty=true; return; }
    if(a==="signout"){ S.drawer=false; signOut(); return; }
    if(a==="forgot"){ forgotPassword(); return; }
    if(a==="eye"){ const k=$("#login-form [name=lg_key]"); if(k){ if(MASK_OK) k.classList.toggle("lg-mask"); else k.type = k.type==="password"?"text":"password"; }
      document.querySelectorAll("#signup-form [name=password],#signup-form [name=password2]").forEach(i=>i.type = i.type==="password"?"text":"password"); return; }
    if(a==="to-signup"||a==="to-signin"){ const f=$("#login-form")||$("#signup-form"); const fe=f&&(f.lg_who||f.email); if(fe) LOGIN.email=fe.value; LOGIN.mode = a==="to-signup"?"signup":"signin"; LOGIN.error=""; LOGIN.info=""; renderLogin(); return; }
    if(a==="send-share"){ sendShare(); return; }
    if(a==="send-dl"){ if(SEND){ downloadBlob(SEND.file, SEND.r.filename); } return; }
    if(a==="send-chat"){ if(SEND) logSent(SEND.o, SEND.r.kind); return; }
    if(a==="new-user"){ openUserForm(); return; }
    if(a==="backup"){ exportBackup(); return; }
    if(a==="fin-entry"){ openFinEntry(null, act.dataset.type||"in"); return; }
    if(a==="fin-opening"){ openOpening(); return; }
    if(a==="bell"){ S.drawer=false; openBell(); return; }
    if(a==="stamp-dl"){ stampPng(); return; }
    if(a==="save-settings"){
      const f = $("#settings-form"); const g = n => $(`[name=${n}]`, f).value;
      const lines = n => g(n).split("\n").map(s=>s.trim()).filter(Boolean);
      const rowsOf = id => $$(`#${id} .sr`).map(r=>[$("[data-sn]",r).value.trim(), num($("[data-sp]",r).value)]).filter(r=>r[0]);
      const sizes = rowsOf("size-rows").map(([size,price])=>({size:size.replace(/\s*[x*X]\s*/,"×"),price})), svcs = rowsOf("svc-rows").map(([name,price])=>({name,price}));
      const prices = $$("#price-rows .pr").map(r=>({name:$("[data-pn]",r).value.trim(), price:num($("[data-pp]",r).value)})).filter(p=>p.name);
      S.settingsDirty = false; const theme = themeOf(); S.themePreview = null;
      store.saveSettings({...S.settings, theme, brandV:3, postal:g("postal").trim(), stampTop:g("stampTop").trim(), stampBottom:g("stampBottom").trim(), notifyEveryStep:$("[name=notifyEveryStep]",f).checked,
        corridorRate:num(g("corridorRate")), expressMult:num(g("expressMult"))||2, customRate:num(g("customRate")), carpetSizes:sizes.length?sizes:DEFAULT_SETTINGS.carpetSizes, extraServices:svcs, businessName:g("businessName").trim()||"Cleaning", phone:g("phone").trim(), address:g("address").trim(),
        defaultDeliveryFee:num(g("defaultDeliveryFee")), clothDays:num(g("clothDays")), carpetDays:num(g("carpetDays")),
        drivers:lines("drivers"), expenseCategories:lines("expenseCategories").length?lines("expenseCategories"):DEFAULT_SETTINGS.expenseCategories, clothPrices:prices.length?prices:DEFAULT_SETTINGS.clothPrices});
      showToast("Settings saved"); return;
    }
  }
  const pdfB = t.closest("[data-pdf]");
  if(pdfB){ const [k,id] = pdfB.dataset.pdf.split("|"); pdfB.disabled=true; try{
      if(k==="invoice"){ const o=orderById(id); if(o) await invoicePdf(o); }
      else if(k==="send"){ const o=orderById(id); if(o) await sendInvoice(o); }
      else if(k==="statement"){ const c=custById(id); if(c) await statementPdf(c); }
      else if(k==="balances") await balancesPdf(); else if(k==="finance"){ if(!(IS_DESKTOP)) await financePdf(); } else if(k==="report") await reportPdf();
    }catch(err){ console.error(err); showToast("Couldn't build the PDF"); } finally { pdfB.disabled=false; } return; }
  const was = t.closest("[data-wasent]");
  if(was){ const [oid,at] = was.dataset.wasent.split("|"); markWaSent(oid, at); if(was.closest("#modal2")) setTimeout(()=>closeModal("#modal2"),300); return; }
  const goK = t.closest("[data-go]");
  if(goK){ const [v,f] = goK.dataset.go.split(":"); if(f) S.ui.orderFilter=f; else if(v==="orders") S.ui.orderFilter="all"; go(v); return; }
  const adv = t.closest("[data-advance]");
  if(adv){ e.stopPropagation(); const o=orderById(adv.dataset.advance); const n=o&&nextStatus(o); if(n) setStatus(o,n); return; }
  const pay = t.closest("[data-pay]");
  if(pay){ e.stopPropagation(); const o=orderById(pay.dataset.pay); if(o) openPayForm(o); return; }
  const del = t.closest("[data-delivered]");
  if(del){ const o=orderById(del.dataset.delivered); if(o) setStatus(o,"Delivered"); return; }
  const rmp = t.closest("[data-rmpay]");
  if(rmp){ const o=orderById(S.modal&&S.modal.id); if(o && await confirmBox("Remove this payment from the order?","Remove")){ const n=structuredClone(o); n.payments=n.payments.filter(p=>p.id!==rmp.dataset.rmpay); n.updatedAt=Date.now(); store.put("orders",n); } return; }
  const rc = t.closest("[data-receipt]"); if(rc){ const o=orderById(rc.dataset.receipt); if(o) openReceipt(o); return; }
  const eo = t.closest("[data-editorder]"); if(eo){ const o=orderById(eo.dataset.editorder); if(o) openOrderForm(o); return; }
  const dlo = t.closest("[data-delorder]"); if(dlo){ const o=orderById(dlo.dataset.delorder); if(o && await confirmBox(`Delete order ${o.no}? Its payments will also be removed from reports.`)){ closeModal("#modal"); store.del("orders",o.id); showToast("Order deleted"); } return; }
  const ec = t.closest("[data-editcust]"); if(ec){ const c=custById(ec.dataset.editcust); if(c) openCustForm(c); return; }
  const dc = t.closest("[data-delcust]"); if(dc){ const c=custById(dc.dataset.delcust); if(c && await confirmBox(`Delete customer ${c.name}?`)){ closeModal("#modal"); store.del("customers",c.id); } return; }
  const fe = t.closest("[data-fin]"); if(fe){ const f=S.fin.find(x=>x.id===fe.dataset.fin); if(f && !S.readOnly) openFinEntry(f); return; }
  const ex = t.closest("[data-exp]"); if(ex){ const x=S.expenses.find(y=>y.id===ex.dataset.exp); if(x) openExpForm(x); return; }
  const th = t.closest("[data-theme]"); if(th){ const [a,b]=th.dataset.theme.split(","); previewTheme(a,b); return; }
  const lt = t.closest("[data-ltab]"); if(lt){ const f=$("#login-form"); if(f) LOGIN.email=f.lg_who.value; LOGIN.tab=lt.dataset.ltab; LOGIN.error=""; LOGIN.info=""; renderLogin(); return; }
  const ur = t.closest("[data-ureset]"); if(ur){ try{ await AUTH.sendPasswordResetEmail(ur.dataset.ureset); showToast("Password reset email sent to "+ur.dataset.ureset); }catch(_){ showToast("Couldn't send the reset email"); } return; }
  const uap = t.closest("[data-uapprove]"); if(uap){ const u=S.users.find(x=>x.id===uap.dataset.uapprove); if(u){ store.put("users",{...structuredClone(u), role:"staff", active:true, pending:false, rejected:false, approvedAt:Date.now(), approvedBy:S.profile.email}); showToast(`${u.name||u.email} approved`); } return; }
  const urj = t.closest("[data-ureject]"); if(urj){ const u=S.users.find(x=>x.id===urj.dataset.ureject); if(u && await confirmBox(`Reject ${u.name||u.email}? They won't be able to use the system.`,"Reject")){ store.put("users",{...structuredClone(u), active:false, pending:false, rejected:true}); } return; }
  const kb = t.closest("[data-kick]"); if(kb){ const x=(S.sessions||[]).find(y=>y.id===kb.dataset.kick); if(x && isOwnerUser() && await confirmBox(`Sign ${x.name||x.email} out of ${x.device||"that device"}?`,"Sign out")){ (({id, ...rest}) => DB.doc("sessions/"+x.id).set({...rest, kick:true}))(x).catch(e=>showToast("Couldn't sign them out: "+(e.code||e.message))); showToast("Signing them out…"); } return; }
  const ua = t.closest("[data-uactive]"); if(ua){ const u=S.users.find(x=>x.id===ua.dataset.uactive); if(u){ const off = u.active!==false; if(!off || await confirmBox(`Switch off ${u.name||u.email}? They won't be able to use the system.`,"Switch off")){ store.put("users",{...structuredClone(u), active:!off}); } } return; }
  const ui = t.closest("[data-ui]"); if(ui){ S.ui[ui.dataset.ui]=ui.dataset.v; render(); return; }
  const ord = t.closest("[data-order]"); if(ord){ if($("#modal2").innerHTML) closeModal("#modal2"); openOrder(ord.dataset.order); return; }
  const cu = t.closest("[data-cust]"); if(cu){ e.preventDefault(); openCust(cu.dataset.cust); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.urole){ const u=S.users.find(x=>x.id===t.dataset.urole); if(u){ store.put("users",{...structuredClone(u), role:t.value}); showToast(`${u.name||u.email} is now ${ROLES[t.value]}`); } return; }
  if(t.dataset.setstatus){ const o=orderById(t.dataset.setstatus); if(o && t.value!==o.status) setStatus(o, t.value); }
  if(t.dataset.driver!==undefined && t.dataset.driver){ const o=orderById(t.dataset.driver); if(o){ const n=structuredClone(o); n.delivery.driver=t.value; n.updatedAt=Date.now(); addHistory(n,{type:"driver", driver:t.value}); store.put("orders",n); showToast(t.value?`Assigned to ${t.value}`:"Driver cleared"); } }
  if(t.dataset.rep){ S.ui[t.dataset.rep]=t.value; render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.closest && t.closest("#settings-form")) S.settingsDirty = true;
  if(t.name==="stampTop"||t.name==="stampBottom") refreshStampPreview();
  if(t.id==="g1"||t.id==="g2"){ previewTheme($("#g1").value, $("#g2").value); return; }
  if(t.dataset.search){ S.ui[t.dataset.search]=t.value; const pos=t.selectionStart; render(); const n=$(`[data-search="${t.dataset.search}"]`); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
});
document.addEventListener("submit", e => {
  const f = e.target;
  if(f.dataset && f.dataset.payform){ e.preventDefault(); recordPayment(f); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape"){ if($("#modal2").innerHTML) closeModal("#modal2"); else if($("#modal").innerHTML) closeModal("#modal"); } });

/* ---------------- start ---------------- */
{ const h=location.hash.slice(1); if(NAV.some(n=>n[0]===h)) S.view=h; }
startApp();
